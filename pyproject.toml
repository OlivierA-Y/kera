[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kera-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "Pillow", "matplotlib", "scipy", "joblib", "torch"]
[project.scripts]
kera-data = "kera_ml.data:main"
kera-train = "kera_ml.train:main"
kera-predict = "kera_ml.inference:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
